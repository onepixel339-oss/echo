# ECHO — CI (Phase 1, A1).
#
# Every gate that exists locally runs on every push and PR:
#   quality  — lint (strict lib/echo rules), tsc --noEmit (noImplicitAny),
#              domain tests (bun), secret scan (+ its self-test) and the
#              version-consistency check
#   build    — the production build must succeed
#   e2e      — the six-flow Playwright suite (25 tests) against the
#              standalone production server; providers are mocked at the
#              network layer, so CI never calls a live provider
#
# Deliberately NOT in CI: the perf baseline (machine-class numbers — a
# dedicated A3 Lighthouse pass owns performance), the cost-table check
# (pure doc derivation, runs locally via `bun run cost-table:check`), and
# any live-provider smoke test (they need explicit authorization).

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (strict lib/echo rules + repo-wide eslint)
        run: bun run lint

      - name: Type-check (tsc --noEmit, noImplicitAny)
        run: bun run typecheck

      - name: Domain tests
        run: bun run test

      - name: Secret scan (with self-test)
        run: |
          bun run secret-scan:self-test
          bun run secret-scan

      - name: Version consistency (package.json = Settings = CHANGELOG)
        run: bun run version-check

      - name: Cost-table drift check
        run: bun run cost-table:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build the standalone production server
        run: bun run build:standalone

      - name: Six-flow e2e suite (mocked providers, no live calls)
        run: bun run test:e2e

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
